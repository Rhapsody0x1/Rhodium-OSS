# Make the install packages for a release (#385): scripts/package.sh on an x86_64 and an arm64
# runner, the Windows x64 zip as ci.yml builds it, one zip per team plugin (scripts/plugin-package.ts),
# then a draft prerelease v<version>-<12-char commit> with all of them and their SHA256SUMS, for a maintainer to read and publish. Run by hand only.
# How to run it: deploy/README.md, 打安装包.
name: Release packages

on: workflow_dispatch

permissions: {}

# Two runs at once would make two drafts of the same commit.
concurrency: release

jobs:
  package:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.rhodium }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Bun the notices are written for (scripts/notices.ts): rhodium carries its runtime.
      - id: versions
        run: |
          bun=$(basename release/licenses/bun-*.md .md)
          echo "bun=${bun#bun-}" >>"$GITHUB_OUTPUT"
          echo "rhodium=$(jq -r .version package.json)" >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      # package.sh installs the Rust its notices are written for itself.
      - run: scripts/package.sh dist ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.arch }}
          path: dist/*.tar.xz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same Bun and Rust as the Linux packages and their notices.
      - id: versions
        shell: bash
        run: |
          bun=$(basename release/licenses/bun-*.md .md)
          echo "bun=${bun#bun-}" >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - run: bun install --frozen-lockfile
      - name: Select Rust toolchain for the notices
        shell: pwsh
        run: |
          $version = (Get-Item release/licenses/rust-*.md).BaseName.Substring(5)
          $toolchain = "$version-x86_64-pc-windows-msvc"
          rustup toolchain install $toolchain --profile minimal --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
      - shell: pwsh
        run: ./scripts/windows-build.ps1
      - shell: pwsh
        run: ./scripts/windows-package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: dist/rhodium-*-win-x64.zip
          if-no-files-found: error
          compression-level: 0

  plugins:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same Bun as the core packages.
      - id: versions
        run: |
          bun=$(basename release/licenses/bun-*.md .md)
          echo "bun=${bun#bun-}" >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
      - run: bun install --frozen-lockfile
      # --check runs each unzipped package's conformance check offline.
      - run: bun scripts/plugin-package.ts dist --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins
          path: dist/rhodium-plugin-*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [package, windows, plugins]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: sha256sum -- *.tar.xz *.zip | tee SHA256SUMS
      # One draft per built commit. A draft of this commit already there gets this run's files in
      # place of its own, its notes kept; a published one is never touched.
      - run: |
          short=${GITHUB_SHA::12}
          tag="v$VERSION-$short"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            [ "$draft" = true ] || { echo "$tag 已经发布过了，这个提交不再重打" >&2; exit 1; }
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r a; do gh release delete-asset "$tag" "$a" --yes; done
          else
            gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "Rhodium $VERSION ($short)" \
              --notes "安装包：Linux x86_64 和 arm64 各一个，Windows x64 一个；组员的插件每个一个 rhodium-plugin-*.zip。Linux 的装法见包里的 INSTALLATION.md，Windows 的见 zip 里的 README.md，插件的见仓库 README 的插件一节。下载后可以用 sha256sum -c --ignore-missing SHA256SUMS 校验。"
          fi
          gh release upload "$tag" dist/*
