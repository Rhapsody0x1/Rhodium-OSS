# Keep the existing manual probes and preview-package entry point.
name: Windows native exploration
on:
  workflow_dispatch:
    inputs:
      repeat_pi_identity:
        description: Repeat the managed pi multi-child regression
        type: boolean
      herdr_tui_probe:
        description: Run only the isolated Herdr terminal probe
        type: boolean
      macos_check:
        description: Run only the native macOS check
        type: boolean
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      repeat_pi_identity: ${{ inputs.repeat_pi_identity }}
      herdr_tui_probe: ${{ inputs.herdr_tui_probe }}
      macos_check: ${{ inputs.macos_check }}
